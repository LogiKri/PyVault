[project]
name = "wisp"
version = "0.1.0"
description = "A small local/server password vault CLI"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "mysql-connector-python>=8.0",
]

[project.scripts]
wisp = "wisp.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
